<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MikeMeetings</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23FBFAF7'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23a05cff'/%3E%3C/svg%3E" />
<style>
  :root{ --bg:#FBFAF7; --ink:#17130E; --muted:#6c6458; --faint:#9a9082; --line:#ece6dc; --card:#fff; --surface:#f4f1ea;
    --accent:#a05cff; --coral:#FF8A5B; --rose:#FF6FA5; --peri:#7C7CFF; --danger:#c0392b;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; --disp:Georgia,"Times New Roman",serif;
    --shadow:0 2px 14px rgba(20,20,30,.10); }
  *{box-sizing:border-box;} html,body{margin:0;height:100%;}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh;}
  a{color:var(--accent);text-decoration:none;}
  header.bar{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line);background:var(--card);}
  .logo{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:15px;background:linear-gradient(135deg,var(--peri),var(--accent));}
  .brand{font-family:var(--disp);font-weight:600;font-size:18px;} .brand .dot{color:var(--accent);}
  .spacer{flex:1;}
  .btn{border:0;border-radius:22px;height:40px;padding:0 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--sans);display:inline-flex;align-items:center;gap:8px;}
  .btn.primary{background:var(--accent);color:#fff;box-shadow:var(--shadow);} .btn.primary:hover{filter:brightness(1.06);}
  .btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);}
  .btn.danger{background:var(--danger);color:#fff;}
  .chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:22px;height:38px;padding:0 12px 0 6px;}
  .chip .av{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;}
  .chip .nm{font-size:13px;font-weight:700;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  main{flex:1;display:flex;flex-direction:column;}
  /* home */
  .home{max-width:760px;margin:0 auto;padding:34px 20px 60px;width:100%;}
  .hero{text-align:center;margin-bottom:26px;}
  .hero h1{font-family:var(--disp);font-weight:600;font-size:34px;margin:6px 0 6px;}
  .hero p{color:var(--muted);font-size:16px;margin:0;}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);}
  .card h3{font-family:var(--disp);font-weight:600;margin:0 0 4px;font-size:19px;} .card p{color:var(--muted);font-size:13.5px;margin:0 0 14px;}
  .card.full{grid-column:1/3;}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;} .field label{font-size:12px;color:var(--muted);font-weight:600;}
  .field input{border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;font-family:var(--sans);background:var(--card);}
  .field input:focus{outline:none;border-color:var(--accent);}
  .row{display:flex;gap:10px;} .row>*{flex:1;}
  .join-row{display:flex;gap:8px;} .join-row input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;}
  .mlist{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px;}
  .mlist li{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding:11px 2px;}
  .mlist li:first-child{border-top:0;} .mi-when{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted);min-width:120px;}
  .mi-title{font-weight:650;flex:1;} .mnone{color:var(--faint);font-size:13.5px;padding:8px 2px;}
  .signin-hero{text-align:center;padding:8vh 20px;} .signin-hero .g{font-size:44px;} .signin-hero h1{font-family:var(--disp);font-size:30px;margin:.3em 0 .2em;}
  .signin-hero p{color:var(--muted);margin:0 0 20px;}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:22px;font-size:13.5px;box-shadow:var(--shadow);z-index:60;}
  /* room */
  .room{flex:1;display:flex;flex-direction:column;background:#14110d;}
  .grid{flex:1;display:grid;gap:10px;padding:14px;align-content:center;justify-content:center;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));}
  .tile{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:16/9;box-shadow:0 4px 18px rgba(0,0,0,.4);}
  .tile video{width:100%;height:100%;object-fit:cover;background:#000;}
  .tile .nm{position:absolute;left:10px;bottom:8px;color:#fff;font-size:12.5px;background:rgba(0,0,0,.45);padding:3px 9px;border-radius:12px;}
  .tile .mutedic{position:absolute;right:10px;top:8px;color:#fff;font-size:13px;background:rgba(0,0,0,.45);border-radius:50%;width:24px;height:24px;display:none;place-items:center;}
  .tile.ismuted .mutedic{display:grid;}
  .controls{display:flex;justify-content:center;gap:12px;padding:14px;background:#0e0b08;border-top:1px solid #2a241c;}
  .ctl{width:52px;height:52px;border-radius:50%;border:0;cursor:pointer;font-size:20px;color:#fff;background:#2a241c;display:grid;place-items:center;}
  .ctl:hover{filter:brightness(1.15);} .ctl.off{background:var(--danger);} .ctl.leave{background:var(--danger);width:auto;padding:0 20px;border-radius:26px;font-size:15px;font-weight:700;gap:8px;}
  .roomtop{display:flex;align-items:center;gap:10px;padding:9px 16px;background:#0e0b08;color:#fff;border-bottom:1px solid #2a241c;}
  .roomtop .rid{font-family:ui-monospace,monospace;font-size:13px;color:#c9c2b4;} .roomtop .cnt{font-size:12.5px;color:#9a9082;}
  @media(max-width:640px){ .cards{grid-template-columns:1fr;} .card.full{grid-column:1;} }
</style>
</head>
<body>
  <div id="app"></div>
  <div class="toast" id="toast" hidden></div>
<script>
const $=(s,r=document)=>r.querySelector(s);
const app=$('#app'), toast=$('#toast');
const showToast=(m,ms=2600)=>{toast.textContent=m;toast.hidden=false;clearTimeout(showToast._t);showToast._t=setTimeout(()=>toast.hidden=true,ms);};
const initials=s=>{const p=(s||'').trim().split(/[\s@.]+/).filter(Boolean);return((p[0]?.[0]||'M')+(p[1]?.[0]||'')).toUpperCase();};
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const api=(u,o)=>fetch(u,o).then(r=>r.json().catch(()=>({})));
const fmtWhen=iso=>{const d=new Date(iso);if(isNaN(d))return '';return d.toLocaleString([], {weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});};

let me=null;
const roomMatch=location.pathname.match(/^\/r\/([A-Za-z0-9]+)/);

async function boot(){
  me=await api('/api/me').catch(()=>({authenticated:false}));
  if(roomMatch){ renderRoom(roomMatch[1]); } else { renderHome(); }
}

// ===================== HOME =====================
function header(){
  return `<header class="bar"><div class="logo">◎</div><div class="brand">Mike<span class="dot">Meetings</span></div><div class="spacer"></div>
    ${me.authenticated?`<div class="chip"><div class="av">${initials(me.user?.name||me.user?.email)}</div><div class="nm">${esc(me.user?.name||'MikeOS user')}</div>
      <button class="btn ghost" style="height:30px;padding:0 12px" onclick="logout()">Sign out</button></div>`
    :`<button class="btn primary" onclick="location.href='/auth/login'">🔑 Sign in</button>`}</header>`;
}
window.logout=async()=>{await fetch('/auth/logout',{method:'POST'});location.href='/';};

async function renderHome(){
  if(!me.authenticated){
    app.innerHTML=header()+`<main><div class="signin-hero"><div class="g">◎</div><h1>Meetings, the MikeOS way</h1>
      <p>Video calls that land on your calendar — signed in with your MikeOS Account, on our own servers.</p>
      <button class="btn primary" onclick="location.href='/auth/login'">🔑 Sign in with MikeOS Account</button></div></main>`;
    return;
  }
  app.innerHTML=header()+`<main><div class="home">
    <div class="hero"><h1>Start or schedule a meeting</h1><p>Instant rooms, or scheduled meetings saved to your MikeOS calendar.</p></div>
    <div class="cards">
      <div class="card"><h3>Instant meeting</h3><p>Create a room and start right now.</p>
        <button class="btn primary" id="instant">◎ Start meeting</button></div>
      <div class="card"><h3>Join</h3><p>Paste a room link or enter a code.</p>
        <div class="join-row"><input id="joincode" placeholder="link or code" /><button class="btn ghost" id="joinbtn">Join</button></div></div>
      <div class="card full"><h3>Schedule a meeting</h3><p>Saved to your MikeOS calendar with a join link.</p>
        <div class="field"><label>Title</label><input id="m-title" placeholder="Team standup" /></div>
        <div class="row"><div class="field"><label>Start</label><input id="m-start" type="datetime-local" /></div>
          <div class="field"><label>End (optional)</label><input id="m-end" type="datetime-local" /></div></div>
        <button class="btn primary" id="schedule">📅 Schedule</button></div>
      <div class="card full"><h3>Upcoming meetings</h3><ul class="mlist" id="mlist"><li class="mnone">Loading…</li></ul></div>
    </div></div></main>`;

  $('#instant').onclick=async()=>{ const r=await api('/api/rooms',{method:'POST'}); if(r.room_id) location.href='/r/'+r.room_id; else showToast('Could not create room'); };
  $('#joinbtn').onclick=()=>{ const v=$('#joincode').value.trim(); const m=v.match(/\/r\/([A-Za-z0-9]+)/)||v.match(/^([A-Za-z0-9]+)$/); if(m) location.href='/r/'+m[1]; else showToast('Enter a valid room link or code'); };
  $('#schedule').onclick=async()=>{
    const title=$('#m-title').value.trim(), start=$('#m-start').value, end=$('#m-end').value;
    if(!start){ showToast('Pick a start time'); return; }
    $('#schedule').disabled=true;
    const r=await api('/api/meetings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,start,end})});
    $('#schedule').disabled=false;
    if(r.saved){ showToast('Scheduled — added to your calendar'); $('#m-title').value='';$('#m-start').value='';$('#m-end').value=''; loadMeetings(); }
    else showToast('Could not save: '+(r.error||'error'));
  };
  loadMeetings();
}
async function loadMeetings(){
  const el=$('#mlist'); if(!el)return;
  const r=await api('/api/meetings').catch(()=>({meetings:[]}));
  const ms=r.meetings||[];
  el.innerHTML=ms.length?'':'<li class="mnone">No upcoming meetings.</li>';
  for(const m of ms){
    const li=document.createElement('li');
    li.innerHTML=`<span class="mi-when">${esc(fmtWhen(m.start))}</span><span class="mi-title">${esc(m.title)}</span>
      <button class="btn primary" style="height:34px;padding:0 16px">Join</button>`;
    li.querySelector('button').onclick=()=>location.href='/r/'+m.room_id;
    el.appendChild(li);
  }
}

// ===================== ROOM =====================
async function renderRoom(roomId){
  if(!me.authenticated){ location.href='/auth/login'; return; }
  app.innerHTML=`<div class="room">
    <div class="roomtop"><div class="logo">◎</div><div class="rid">/r/${esc(roomId)}</div><div class="cnt" id="cnt">connecting…</div>
      <div class="spacer" style="flex:1"></div><button class="btn ghost" style="height:32px" id="copy">Copy link</button></div>
    <div class="grid" id="grid"></div>
    <div class="controls">
      <button class="ctl" id="mic" title="Mute">🎙️</button>
      <button class="ctl" id="cam" title="Camera">🎥</button>
      <button class="ctl leave" id="leave">⏻ Leave</button>
    </div></div>`;
  $('#copy').onclick=()=>{navigator.clipboard?.writeText(location.href);showToast('Link copied');};

  let localStream, iceServers=[], ws, selfId=null;
  const pcs=new Map(); // peerId -> RTCPeerConnection
  const grid=$('#grid'), cnt=$('#cnt');

  function tile(id,name,muted){
    let t=grid.querySelector(`[data-p="${id}"]`);
    if(!t){ t=document.createElement('div'); t.className='tile'; t.dataset.p=id;
      t.innerHTML=`<video autoplay playsinline ${id==='self'?'muted':''}></video><div class="nm"></div><div class="mutedic">🔇</div>`; grid.appendChild(t); }
    t.querySelector('.nm').textContent=name||'Guest';
    if(muted!==undefined) t.classList.toggle('ismuted',muted);
    return t;
  }
  const updCnt=()=>{ cnt.textContent=(pcs.size+1)+' in call'; };

  try{ localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:true}); }
  catch(e){ showToast('Camera/mic blocked — check permissions'); localStream=new MediaStream(); }
  tile('self', (me.user?.name||'You')+' (you)').querySelector('video').srcObject=localStream;
  updCnt();

  const ice=await api('/api/ice').catch(()=>({iceServers:[]})); iceServers=ice.iceServers||[];

  function wsSend(o){ try{ ws.send(JSON.stringify(o)); }catch{} }
  function makePC(peerId,name,initiator){
    const pc=new RTCPeerConnection({iceServers});
    pcs.set(peerId,pc);
    localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
    pc.onicecandidate=e=>{ if(e.candidate) wsSend({type:'signal',to:peerId,data:{candidate:e.candidate}}); };
    pc.ontrack=e=>{ tile(peerId,name).querySelector('video').srcObject=e.streams[0]; updCnt(); };
    pc.onconnectionstatechange=()=>{ if(['failed','closed','disconnected'].includes(pc.connectionState)) dropPeer(peerId); };
    if(initiator){ pc.createOffer().then(o=>pc.setLocalDescription(o)).then(()=>wsSend({type:'signal',to:peerId,data:{sdp:pc.localDescription}})).catch(()=>{}); }
    updCnt(); return pc;
  }
  async function onSignal(from,name,data){
    let pc=pcs.get(from);
    if(data.sdp){
      if(!pc) pc=makePC(from,name,false);
      await pc.setRemoteDescription(data.sdp);
      if(data.sdp.type==='offer'){ const a=await pc.createAnswer(); await pc.setLocalDescription(a); wsSend({type:'signal',to:from,data:{sdp:pc.localDescription}}); }
    } else if(data.candidate){ if(pc) try{ await pc.addIceCandidate(data.candidate); }catch{} }
  }
  function dropPeer(id){ const pc=pcs.get(id); if(pc){ pc.close(); pcs.delete(id);} grid.querySelector(`[data-p="${id}"]`)?.remove(); updCnt(); }

  const proto=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen=()=>wsSend({type:'join',room:roomId,name:me.user?.name||'Guest'});
  ws.onclose=()=>{ cnt.textContent='disconnected'; };
  ws.onmessage=ev=>{ let m; try{m=JSON.parse(ev.data);}catch{return;}
    if(m.type==='welcome'){ selfId=m.self; (m.peers||[]).forEach(p=>makePC(p.id,p.name,true)); }
    else if(m.type==='peer-joined'){ /* they will offer to us */ }
    else if(m.type==='signal'){ onSignal(m.from,m.name,m.data); }
    else if(m.type==='peer-left'){ dropPeer(m.id); }
  };

  // controls
  let micOn=true, camOn=true;
  $('#mic').onclick=()=>{ micOn=!micOn; localStream.getAudioTracks().forEach(t=>t.enabled=micOn); $('#mic').classList.toggle('off',!micOn); $('#mic').textContent=micOn?'🎙️':'🔇'; tile('self').classList.toggle('ismuted',!micOn); };
  $('#cam').onclick=()=>{ camOn=!camOn; localStream.getVideoTracks().forEach(t=>t.enabled=camOn); $('#cam').classList.toggle('off',!camOn); $('#cam').textContent=camOn?'🎥':'🚫'; };
  $('#leave').onclick=()=>{ try{wsSend({type:'leave'});ws.close();}catch{} pcs.forEach(pc=>pc.close()); localStream.getTracks().forEach(t=>t.stop()); location.href='/'; };
  window.addEventListener('beforeunload',()=>{ try{wsSend({type:'leave'});}catch{} });
}

boot();
</script>
</body>
</html>
