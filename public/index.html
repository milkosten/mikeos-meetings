<script>
/* Appearance before first paint: stored system|light|dark (default system). Storage may be unavailable. */
(function(){var p="system";try{p=localStorage.getItem("osmike-appearance")||"system"}catch(e){}
if(["system","light","dark"].indexOf(p)<0)p="system";
var m=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)");
var r=p==="system"?(m&&m.matches?"dark":"light"):p;var h=document.documentElement;
h.setAttribute("data-theme",r);h.style.colorScheme=r;h.setAttribute("data-appearance",p);})();
</script>
